<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Samu Barber - POS Punto de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .ticket-box { background: #fff; padding: 15px; border: 1px dashed #333; font-family: monospace; }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid">
        <h2 class="mb-4">💈 Punto de Venta (POS) - Samu Barber</h2>
        <div class="row">
            <!-- Selección de Catálogo -->
            <div class="col-md-7">
                <div class="card mb-3">
                    <div class="card-header bg-dark text-white">Catálogo de Servicios y Productos</div>
                    <div class="card-body">
                        <h5>Servicios (Cortes)</h5>
                        <button class="btn btn-outline-primary m-1" onclick="agregarAlCarrito('Servicio', 1, 'Corte Clásico', 35)">Corte Clásico (Bs. 35)</button>
                        <button class="btn btn-outline-primary m-1" onclick="agregarAlCarrito('Servicio', 2, 'Barba & Perfilar', 25)">Barba (Bs. 25)</button>
                        <button class="btn btn-outline-primary m-1" onclick="agregarAlCarrito('Servicio', 3, 'Combo Barba + Corte', 50)">Combo (Bs. 50)</button>

                        <h5 class="mt-3">Productos</h5>
                        <button class="btn btn-outline-success m-1" onclick="agregarAlCarrito('Producto', 1, 'Cera Modeladora', 40)">Cera Modeladora (Bs. 40)</button>
                        <button class="btn btn-outline-success m-1" onclick="agregarAlCarrito('Producto', 2, 'Polvo Texturizante', 45)">Polvo Texturizante (Bs. 45)</button>
                    </div>
                </div>
            </div>

            <!-- Detalle de Venta y Cobro -->
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header bg-primary text-white">Detalle de la Venta</div>
                    <div class="card-body">
                        <!-- Campo para seleccionar Cliente dentro de la tarjeta -->
                        <div class="mb-3">
                            <label for="selectClientePOS" class="form-label fw-bold">Cliente:</label>
                            <select id="selectClientePOS" class="form-select">
                                <option value="">-- Cargando clientes... --</option>
                            </select>
                        </div>

                        <table class="table table-sm">
                            <thead>
                                <tr><th>Item</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr>
                            </thead>
                            <tbody id="tablaCarrito"></tbody>
                        </table>
                        <hr>
                        <h4>Total: Bs. <span id="lblTotal">0.00</span></h4>

                        <div class="mb-3 mt-3">
                            <label class="form-label fw-bold">Método de Pago:</label>
                            <select id="metodoPago" class="form-select" onchange="toggleEfectivo()">
                                <option value="Efectivo">Efectivo</option>
                                <option value="QR">Pago QR</option>
                            </select>
                        </div>

                        <div class="mb-3" id="boxEfectivo">
                            <label class="form-label fw-bold">Monto Recibido:</label>
                            <input type="number" id="montoRecibido" class="form-control" value="0" oninput="calcularCambio()">
                            <small class="text-muted">Cambio: Bs. <span id="lblCambio">0.00</span></small>
                        </div>

                        <button class="btn btn-success w-100 fw-bold" onclick="procesarCobro()">💳 Procesar Cobro</button>
                    </div>
                </div>

                <!-- Comprobante Digital -->
                <div id="boxComprobante" class="mt-3 d-none">
                    <div class="ticket-box" id="ticketContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5224/api/Ventas';
        const API_CLIENTES_URL = 'http://localhost:5224/api/Clientes';
        let carrito = [];
        let totalVenta = 0;

        // Cargar clientes automáticamente al abrir
        document.addEventListener('DOMContentLoaded', () => {
            cargarClientesPOS();
        });

        async function cargarClientesPOS() {
            try {
                const res = await fetch(API_CLIENTES_URL);
                if (!res.ok) return;
                const clientes = await res.json();

                const select = document.getElementById('selectClientePOS');
                select.innerHTML = '<option value="">-- Consumidor Final (Sin Cliente) --</option>';

                clientes.forEach(c => {
                    select.innerHTML += `<option value="${c.idCliente}">${c.nombre} (${c.telefono})</option>`;
                });
            } catch (err) {
                console.error('Error al cargar clientes en POS:', err);
            }
        }

        function agregarAlCarrito(tipo, id, nombre, precio) {
            let existe = carrito.find(i => i.tipoItem === tipo && i.idItem === id);
            if (existe) {
                existe.cantidad++;
            } else {
                carrito.push({ tipoItem: tipo, idItem: id, nombreItem: nombre, cantidad: 1, precioUnitario: precio });
            }
            renderCarrito();
        }

        function renderCarrito() {
            let tbody = document.getElementById('tablaCarrito');
            tbody.innerHTML = '';
            totalVenta = 0;
            carrito.forEach(item => {
                let subtotal = item.cantidad * item.precioUnitario;
                totalVenta += subtotal;
                tbody.innerHTML += `<tr><td>${item.nombreItem}</td><td>${item.cantidad}</td><td>Bs. ${item.precioUnitario}</td><td>Bs. ${subtotal}</td></tr>`;
            });
            document.getElementById('lblTotal').innerText = totalVenta.toFixed(2);
            calcularCambio();
        }

        function toggleEfectivo() {
            let metodo = document.getElementById('metodoPago').value;
            document.getElementById('boxEfectivo').style.display = (metodo === 'Efectivo') ? 'block' : 'none';
        }

        function calcularCambio() {
            let recibido = parseFloat(document.getElementById('montoRecibido').value) || 0;
            let cambio = recibido - totalVenta;
            document.getElementById('lblCambio').innerText = cambio > 0 ? cambio.toFixed(2) : '0.00';
        }

        async function procesarCobro() {
            if (carrito.length === 0) return alert("Agrega ítems a la venta.");

            const clienteIdVal = document.getElementById('selectClientePOS').value;

            let payload = {
                idBarbero: 1,
                idCliente: clienteIdVal ? parseInt(clienteIdVal) : null,
                metodoPago: document.getElementById('metodoPago').value,
                montoRecibido: parseFloat(document.getElementById('montoRecibido').value) || totalVenta,
                items: carrito
            };

            let res = await fetch(`${API_URL}/registrar-cobro`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                let err = await res.text();
                return alert("Error: " + err);
            }

            let data = await res.json();
            alert("¡Cobro exitoso!");
            generarComprobante(data.idVenta);
        }

        async function generarComprobante(idVenta) {
            let res = await fetch(`${API_URL}/comprobante/${idVenta}`);
            let comp = await res.json();

            let html = `<strong>${comp.establecimiento}</strong><br>`;
            html += `Comprobante: ${comp.numeroComprobante}<br>`;
            html += `Fecha: ${comp.fecha}<br>`;
            html += `Pago: ${comp.metodoPago}<br><hr>`;
            comp.items.forEach(i => {
                html += `${i.cant}x ${i.descripcion} - Bs. ${i.subtotal}<br>`;
            });
            html += `<hr><strong>TOTAL: Bs. ${comp.total}</strong><br>`;
            html += `Recibido: Bs. ${comp.montoRecibido}<br>`;
            html += `Cambio: Bs. ${comp.cambio}`;

            document.getElementById('ticketContent').innerHTML = html;
            document.getElementById('boxComprobante').classList.remove('d-none');
            carrito = [];
            renderCarrito();
        }
    </script>
</body>
</html>
