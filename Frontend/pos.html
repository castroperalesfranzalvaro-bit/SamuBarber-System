<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta (POS) - Samu Barber</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container-fluid py-4 px-4">
        <h2 class="mb-4 fw-bold">💈 Punto de Venta (POS) - Samu Barber</h2>

        <div class="row g-4">
            <!-- COLUMNA IZQUIERDA: Catálogo e Ítems Seleccionados (Ancho 7) -->
            <div class="col-lg-7">
                
                <!-- 1. Catálogo de Productos -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-dark text-white fw-bold">
                        Catálogo de Productos
                    </div>
                    <div class="card-body">
                        <h6 class="fw-bold text-muted mb-3">Productos Disponibles</h6>
                        <div id="contenedorProductosPOS" class="d-flex gap-2 flex-wrap">
                            <span class="text-muted small">Cargando catálogo...</span>
                        </div>
                    </div>
                </div>

                <!-- 2. Tabla de Ítems del Carrito -->
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white fw-bold">
                        Ítems Seleccionados
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Item</th>
                                        <th class="text-center">Cant.</th>
                                        <th>Precio Unit.</th>
                                        <th>Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaCarrito">
                                    <tr>
                                        <td colspan="4" class="text-center text-muted py-3">No hay ítems agregados.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>

            <!-- COLUMNA DERECHA: Resumen de Cobro y Pagos (Ancho 5) -->
            <div class="col-lg-5">
                <div class="card shadow-sm border-primary">
                    <div class="card-header bg-primary text-white fw-bold fs-5">
                        Resumen del Cobro
                    </div>
                    <div class="card-body">
                        
                        <!-- Nombre del Cliente -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Cliente:</label>
                            <input type="text" id="txtNombreClientePOS" class="form-control form-control-lg bg-light" placeholder="Consumidor Final" readonly>
                        </div>

                        <!-- Caja Grande con el Total -->
                        <div class="p-3 bg-light rounded text-center mb-3 border">
                            <span class="fs-6 text-muted fw-bold text-uppercase">Total a Pagar</span>
                            <h1 class="text-primary fw-bold display-5 my-1">Bs. <span id="lblTotal">0.00</span></h1>
                        </div>

                        <!-- Método de Pago -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Método de Pago:</label>
                            <select id="metodoPago" class="form-select form-select-lg" onchange="toggleEfectivo()">
                                <option value="Efectivo">Efectivo</option>
                                <option value="QR">Pago QR</option>
                            </select>
                        </div>

                        <!-- Campo Efectivo / Cambio -->
                        <div id="boxEfectivo" class="mb-3 p-3 bg-white rounded border">
                            <label class="form-label fw-bold">Monto Recibido:</label>
                            <div class="input-group mb-2">
                                <span class="input-group-text fw-bold">Bs.</span>
                                <input type="number" id="montoRecibido" class="form-control form-control-lg" placeholder="0.00" oninput="calcularCambio()">
                            </div>
                            <div class="text-end fw-bold fs-6 text-success">
                                Cambio: Bs. <span id="lblCambio">0.00</span>
                            </div>
                        </div>

                        <!-- Botón Procesar Cobro -->
                        <button class="btn btn-success btn-lg w-100 fw-bold py-3 fs-5 shadow-sm" onclick="procesarCobro()">
                            💳 Procesar Cobro
                        </button>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA Y API -->
    <script>
        const API_URL = 'http://localhost:5224/api/Ventas';
        const API_CITAS_URL = 'http://localhost:5224/api/Citas';
        const API_CLIENTES_URL = 'http://localhost:5224/api/Clientes';
        const API_PRODUCTOS_URL = 'http://localhost:5224/api/Productos';

        let carrito = [];
        let totalVenta = 0;
        let idCitaActual = null;
        let idClienteActual = null;

        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Cargar productos desde la base de datos
            await cargarProductosPOS();

            // 2. Cargar cita enviada desde el panel del barbero
            const citaGuardada = localStorage.getItem('citaPendienteCobro');

            if (citaGuardada) {
                const citaPendiente = JSON.parse(citaGuardada);

                idCitaActual = citaPendiente.idCita || null;
                idClienteActual = citaPendiente.idCliente || null;

                const txtCliente = document.getElementById('txtNombreClientePOS');
                if (txtCliente) {
                    txtCliente.value = citaPendiente.nombreCliente || 'Cliente Presencial';
                }

                const idServicioValido = parseInt(citaPendiente.idServicio) || 1;
                agregarAlCarrito(
                    'Servicio', 
                    idServicioValido, 
                    citaPendiente.nombreServicio || 'Servicio de Barbería', 
                    parseFloat(citaPendiente.precioServicio) || 35.00
                );

                localStorage.removeItem('citaPendienteCobro');
            }
        });

        async function cargarProductosPOS() {
            const contenedor = document.getElementById('contenedorProductosPOS');
            if (!contenedor) return;

            try {
                const res = await fetch(API_PRODUCTOS_URL);
                if (!res.ok) {
                    contenedor.innerHTML = '<span class="text-danger small">No se pudieron cargar los productos.</span>';
                    return;
                }

                const productos = await res.json();
                contenedor.innerHTML = '';

                if (productos.length === 0) {
                    contenedor.innerHTML = '<span class="text-muted small">No hay productos disponibles.</span>';
                    return;
                }

                productos.forEach(p => {
                    const precio = parseFloat(p.precioVenta || p.precio || 35.00);
                    const stock = p.stock !== undefined ? p.stock : 0;
                    const estaAgotado = stock <= 0;

                    const btnClass = estaAgotado ? 'btn-outline-secondary opacity-50' : 'btn-outline-success';
                    const badgeStock = estaAgotado 
                        ? '<span class="badge bg-danger ms-1">Agotado</span>' 
                        : `<span class="badge bg-light text-dark border ms-1">${stock} disp.</span>`;

                    const btnHTML = `
                        <button class="btn ${btnClass} d-flex align-items-center gap-1 mb-2" 
                                ${estaAgotado ? 'disabled' : ''} 
                                onclick="agregarAlCarrito('Producto', ${p.idProducto}, '${p.nombreProducto}', ${precio})">
                            <span>${p.nombreProducto} (Bs. ${precio.toFixed(2)})</span>
                            ${badgeStock}
                        </button>
                    `;

                    contenedor.innerHTML += btnHTML;
                });

            } catch (err) {
                console.error("Error al obtener productos:", err);
                contenedor.innerHTML = '<span class="text-danger small">Error al conectar con la API de Productos.</span>';
            }
        }

        function agregarAlCarrito(tipo, id, nombre, precio) {
            const idNumerico = parseInt(id) || 1;
            
            let existe = carrito.find(i => i.tipoItem === tipo && i.idItem === idNumerico);
            if (existe) {
                existe.cantidad++;
            } else {
                carrito.push({ 
                    tipoItem: tipo, 
                    idItem: idNumerico, 
                    nombreItem: nombre, 
                    cantidad: 1, 
                    precioUnitario: parseFloat(precio) 
                });
            }
            renderCarrito();
        }

        function renderCarrito() {
            let tbody = document.getElementById('tablaCarrito');
            if (!tbody) return;

            tbody.innerHTML = '';
            totalVenta = 0;

            if (carrito.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">No hay ítems agregados.</td></tr>';
            } else {
                carrito.forEach(item => {
                    let subtotal = item.cantidad * item.precioUnitario;
                    totalVenta += subtotal;
                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold">${item.nombreItem}</td>
                            <td class="text-center">${item.cantidad}</td>
                            <td>Bs. ${item.precioUnitario.toFixed(2)}</td>
                            <td class="fw-bold">Bs. ${subtotal.toFixed(2)}</td>
                        </tr>`;
                });
            }

            const lblTotal = document.getElementById('lblTotal');
            if (lblTotal) lblTotal.innerText = totalVenta.toFixed(2);
            
            calcularCambio();
        }

        function toggleEfectivo() {
            let metodo = document.getElementById('metodoPago').value;
            const boxEfectivo = document.getElementById('boxEfectivo');
            if (boxEfectivo) {
                boxEfectivo.style.display = (metodo === 'Efectivo') ? 'block' : 'none';
            }
        }

        function calcularCambio() {
            let recibido = parseFloat(document.getElementById('montoRecibido').value) || 0;
            let cambio = recibido - totalVenta;
            const lblCambio = document.getElementById('lblCambio');
            if (lblCambio) {
                lblCambio.innerText = cambio > 0 ? cambio.toFixed(2) : '0.00';
            }
        }

        async function procesarCobro() {
            if (carrito.length === 0) {
                alert('Debes agregar al menos un servicio o producto para cobrar.');
                return;
            }

            const metodoPago = document.getElementById('metodoPago').value;
            const montoRecibidoInput = parseFloat(document.getElementById('montoRecibido').value) || 0;

            // Validación de Efectivo
            if (metodoPago === 'Efectivo' && montoRecibidoInput < totalVenta) {
                alert(`El monto recibido (Bs. ${montoRecibidoInput.toFixed(2)}) es menor al total a pagar (Bs. ${totalVenta.toFixed(2)}).`);
                return;
            }

            const txtCliente = document.getElementById('txtNombreClientePOS');
            const nombreClienteIngresado = txtCliente && txtCliente.value ? txtCliente.value : 'Consumidor Final';

            const payloadVenta = {
                idCliente: idClienteActual ? parseInt(idClienteActual) : null,
                nombreCliente: nombreClienteIngresado,
                idBarbero: parseInt(localStorage.getItem('idBarberoSesion')) || 1,
                idCita: idCitaActual ? parseInt(idCitaActual) : null,
                metodoPago: metodoPago,
                montoRecibido: metodoPago === 'Efectivo' ? montoRecibidoInput : totalVenta,
                items: carrito.map(item => ({
                    tipoItem: item.tipoItem,
                    idItem: parseInt(item.idItem),
                    nombreItem: item.nombreItem || 'Servicio/Producto',
                    cantidad: parseInt(item.cantidad),
                    precioUnitario: parseFloat(item.precioUnitario)
                }))
            };

            try {
                const resVenta = await fetch('http://localhost:5224/api/Ventas/registrar-cobro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payloadVenta)
                });

                const dataRespuesta = await resVenta.json().catch(() => null);

                if (!resVenta.ok) {
                    let mensaje = 'Error al registrar el cobro.';
                    if (typeof dataRespuesta === 'string') {
                        mensaje = dataRespuesta;
                    } else if (dataRespuesta?.mensaje || dataRespuesta?.title) {
                        mensaje = dataRespuesta.mensaje || dataRespuesta.title;
                    }
                    throw new Error(mensaje);
                }

                // Completar la cita en la cola de esperas
                if (idCitaActual) {
                    await fetch(`${API_CITAS_URL}/completar/${idCitaActual}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' }
                    }).catch(err => console.error("Error al actualizar cita:", err));
                    idCitaActual = null;
                }

                alert(dataRespuesta.mensaje || '¡Venta registrada exitosamente!');
                window.location.href = 'barbero-panel.html';
            } catch (err) {
                console.error("Error al procesar cobro:", err);
                alert(`Ocurrió un error:\n${err.message}`);
            }
        }
    </script>
</body>
</html>
